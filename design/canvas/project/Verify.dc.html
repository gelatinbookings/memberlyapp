<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verification code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 24px; padding: 60px 20px 0">
  <a href="CreateAccount.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
  <div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15">Enter the code we sent</h1>
    <p style="margin: 8px 0 0; font-size: 15px; color: var(--mf)">A 4-digit code went to <span style="color: var(--fg); font-weight: 500">jordan@secondsundays.example</span>.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px" role="group" aria-label="Verification code">
    <span style="height: 64px; border-radius: 6px; border: 1px solid var(--line); background: var(--tint); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800">4</span>
    <span style="height: 64px; border-radius: 6px; border: 1px solid var(--line); background: var(--tint); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800">8</span>
    <span style="height: 64px; border-radius: 6px; border: 1px solid var(--brand); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800"><span style="width: 2px; height: 28px; background: var(--brand); display: block"></span></span>
    <span style="height: 64px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); display: block"></span>
  </div>
  <div style="font-size: 13px; color: var(--mf)">Didn't get it? <a href="#resend" style="font-weight: 600">Resend in 0:24</a></div>
  <a href="Onboarding.dc.html" style="height: 52px; border-radius: 6px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px">Verify<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 8px 8px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-label="Number pad">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button type="button" style="height: 52px; border-radius: 6px; border: 0; background: {{k.bg}}; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{k.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const k = (label, dark) => ({ label, bg: dark ? 'transparent' : 'var(--muted)' });
    return { keys: [k('1'), k('2'), k('3'), k('4'), k('5'), k('6'), k('7'), k('8'), k('9'), k('', true), k('0'), k('⌫', true)] };
  }
}
</script>
</body>
</html>
