<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, your week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;--ok-bg:rgba(6,78,59,.4);--ok-fg:#6ee7b7;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 60px 20px 0">

  <div style="display: flex; align-items: center; gap: 12px">
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Your week</div>
      <div style="font-size: 13px; color: var(--mf); margin-top: 4px">Atlanta · 4 events, 1 pass</div>
    </div>
    <span style="width: 44px; height: 44px; border-radius: 999px; background: var(--tint); color: var(--btext); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0">JR</span>
  </div>

  <div style="display: flex; gap: 6px; margin: 0 -20px; padding: 0 20px; overflow: hidden">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" style="width: 46px; height: 66px; flex-shrink: 0; border-radius: 999px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; line-height: 1"><span style="font-size: 11px; font-weight: 600">{{d.dow}}</span><span style="font-size: 17px; font-weight: 700">{{d.num}}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Friday, Nov 20</div>
    <sc-for list="{{friday}}" as="e" hint-placeholder-count="3">
      <a href="EventPage.dc.html" style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 10px; display: flex; align-items: center; gap: 12px; color: var(--fg)">
        <img src="{{e.img}}" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
        <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.name}}</span><span style="display: block; font-size: 13px; color: var(--mf)">{{e.meta}}</span></span>
        <sc-if value="{{e.pass}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 5px 9px; background: var(--ok-bg); color: var(--ok-fg); flex-shrink: 0">Pass</span></sc-if>
        <sc-if value="{{e.open}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; color: var(--btext); flex-shrink: 0">{{e.price}}</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Saturday, Nov 21</div>
    <a href="EventPage.dc.html" style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 10px; display: flex; align-items: center; gap: 12px; color: var(--fg)">
      <img src="/_blob/5c350a2c20f547df70fc343bc26ffaaa" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
      <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Daylight</span><span style="display: block; font-size: 13px; color: var(--mf)">Day Party Collective · 2:00 PM</span></span>
      <span style="font-size: 13px; font-weight: 600; color: var(--btext); flex-shrink: 0">From $25</span>
    </a>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; box-sizing: border-box; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; padding: 6px; gap: 4px">
    <a href="HomeWeek.dc.html" aria-current="page" style="flex: 1.6 1 0; height: 50px; border-radius: 999px; background: var(--tint); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--btext); font-size: 13px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Explore.dc.html" aria-label="Explore" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9"></polygon></svg></a>
    <a href="Events.dc.html" aria-label="Events" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
    <a href="Me.dc.html" aria-label="Me" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const day = (dow, num, on) => ({ dow, num, border: on ? 'var(--line)' : 'var(--border)', bg: on ? 'var(--tint)' : 'transparent', fg: on ? 'var(--btext)' : 'var(--fg)' });
    return {
      days: [day('Fri', '20', true), day('Sat', '21'), day('Sun', '22'), day('Mon', '23'), day('Tue', '24'), day('Wed', '25'), day('Thu', '26')],
      friday: [
        { img: '/_blob/3a9257843bd2c59903b82feae14987ad', name: 'Warehouse Friday', meta: 'Second Sundays · 10:00 PM', pass: true, open: false },
        { img: '/_blob/f5fe394418c7a84914baa544150400c5', name: 'Rooftop Hours', meta: 'Rooftop Society · 9:00 PM', pass: false, open: true, price: 'From $30' },
        { img: '/_blob/07bc587c0f3a529389180815dd804a32', name: 'Night Service', meta: 'Bass Church · 11:00 PM', pass: false, open: true, price: 'Members' }
      ]
    };
  }
}
</script>
</body>
</html>
