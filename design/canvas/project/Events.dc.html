<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Events, your passes and upcoming</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;--ok-bg:rgba(6,78,59,.4);--ok-fg:#6ee7b7;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 60px 20px 0">

  <div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Events</h1>
    <div style="font-size: 13px; color: var(--mf); margin-top: 4px">1 pass · 2 you're going to</div>
  </div>

  <div style="display: flex; gap: 8px">
    <button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--btext); font-size: 13px; font-weight: 600">Upcoming</button>
    <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 13px; font-weight: 500">Past</button>
    <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 13px; font-weight: 500">Saved</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">This week</div>
    <sc-for list="{{week}}" as="e" hint-placeholder-count="3">
      <a href="EventPage.dc.html" style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 10px; display: flex; align-items: center; gap: 12px; color: var(--fg)">
        <img src="{{e.img}}" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
        <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.name}}</span><span style="display: block; font-size: 13px; color: var(--mf); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.meta}}</span></span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 5px 9px; background: {{e.bg}}; color: {{e.fg}}; flex-shrink: 0">{{e.tag}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Later</div>
    <a href="EventPage.dc.html" style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 10px; display: flex; align-items: center; gap: 12px; color: var(--fg)">
      <img src="/_blob/5c350a2c20f547df70fc343bc26ffaaa" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
      <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Daylight</span><span style="display: block; font-size: 13px; color: var(--mf)">Sat, Nov 28 · Day Party Collective · 2 PM</span></span>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 5px 9px; background: var(--muted); color: var(--mf); flex-shrink: 0">Saved</span>
    </a>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; box-sizing: border-box; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; padding: 6px; gap: 4px">
    <a href="HomeMap.dc.html" aria-label="Home" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="Explore.dc.html" aria-label="Explore" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9"></polygon></svg></a>
    <a href="Events.dc.html" aria-current="page" style="flex: 1.6 1 0; height: 50px; border-radius: 999px; background: var(--tint); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--btext); font-size: 13px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Events</a>
    <a href="Me.dc.html" aria-label="Me" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
  </nav>
</div>
</x-dc>

        { dow: 'SAT', day: '21', img: '/_blob/f5fe394418c7a84914baa544150400c5', name: 'Rooftop Hours', meta: 'Sat, Nov 21 · Rooftop Society · 9 PM', tag: 'Going', bg: 'var(--tint)', fg: 'var(--btext)' },
        { dow: 'SUN', day: '22', img: '/_blob/b39a861e06336e704d715f19909f7729', name: 'Long Table', meta: 'Sun, Nov 22 · Supper Club ATL · 7 PM', tag: 'Going', bg: 'var(--tint)', fg: 'var(--btext)' }
      ]

</body>
</html>
