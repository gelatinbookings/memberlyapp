<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Every booking status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;--ok-bg:rgba(6,78,59,.4);--ok-fg:#6ee7b7;--warn-bg:rgba(120,53,15,.4);--warn-fg:#fcd34d;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 1200px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 60px 20px 0">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="CreateEvent.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg); flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <div style="flex-grow: 1; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">Lineup</h1><div style="font-size: 13px; color: var(--mf)">Every status, as the organizer reads it</div></div>
  </div>

  <div style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); overflow: hidden">
    <sc-for list="{{states}}" as="s" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-top: 1px solid {{s.top}}">
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600; flex-grow: 1">{{s.name}}</span><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 8px; background: {{s.bg}}; color: {{s.fg}}; white-space: nowrap">{{s.label}}</span></div>
        <div style="font-size: 12px; color: var(--mf)">{{s.line}}</div>
        <sc-if value="{{s.isPrimary}}" hint-placeholder-val="{{false}}"><a href="Hold.dc.html" style="align-self: flex-start; height: 44px; padding: 0 16px; border-radius: 999px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; margin-top: 2px">{{s.action}}</a></sc-if>
        <sc-if value="{{s.isLink}}" hint-placeholder-val="{{false}}"><a href="Portal.dc.html" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600">{{s.action}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg></a></sc-if>
        <sc-if value="{{s.isAlt}}" hint-placeholder-val="{{false}}"><a href="Alternates.dc.html" style="align-self: flex-start; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg); display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; margin-top: 2px">{{s.action}}</a></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const warn = { bg: 'var(--warn-bg)', fg: 'var(--warn-fg)' };
    const brand = { bg: 'var(--tint)', fg: 'var(--btext)' };
    const ok = { bg: 'var(--ok-bg)', fg: 'var(--ok-fg)' };
    const off = { bg: 'var(--muted)', fg: 'var(--mf)' };
    const s = (name, label, tone, line, action, kind, i) => Object.assign({ name, label, line, action, isPrimary: kind === 'p', isLink: kind === 'l', isAlt: kind === 'a', top: i === 0 ? 'transparent' : 'var(--border)' }, tone);
    return {
      states: [
        s('KOYO', 'Payment needed', warn, "Not sent until your card is held for $457.00.", 'Pay now', 'p', 0),
        s('KOYO', 'Card held · waiting for the DJ', brand, '$457.00 held, not charged. Charged only if KOYO accepts.', 'Manage in Gelatin', 'l', 1),
        s('KOYO', 'Negotiating', brand, 'You and KOYO are working out the fee in Gelatin.', 'Manage in Gelatin', 'l', 2),
        s('KOYO', 'New offer from the DJ', warn, 'KOYO came back at $520. Your hold was released.', 'Review the new offer in Gelatin', 'l', 3),
        s('KOYO', 'Confirmed', ok, '$457.00 charged. KOYO is on your public lineup.', 'Manage in Gelatin', 'l', 4),
        s('KOYO', 'Passed', off, 'KOYO passed on this one. Your hold was released and you were not charged.', 'Other DJs open that night', 'a', 5),
        s('KOYO', 'Expired', off, "KOYO didn't answer in time. Your hold was released and you were not charged.", 'Other DJs open that night', 'a', 6),
        s('KOYO', 'Cancelled', off, 'This booking was cancelled.', 'Other DJs open that night', 'a', 7)
      ]
    };
  }
}
</script>
</body>
</html>
