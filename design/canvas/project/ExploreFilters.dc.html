<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore filters, bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px; opacity: .35">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Explore</div>
    <div style="height: 48px; border-radius: 999px; border: 1px solid var(--border); background: var(--card)"></div>
    <div style="height: 150px; border: 1px solid var(--border); border-radius: 16px; background: var(--card)"></div>
  </div>

  <div role="dialog" aria-label="Filters" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px">
    <span style="width: 40px; height: 4px; border-radius: 999px; background: var(--border); align-self: center"></span>
    <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Filters</span><button type="button" style="min-height: 44px; border: 0; background: transparent; font-size: 14px; font-weight: 500; color: var(--btext)">Reset</button></div>

    <div style="display: flex; gap: 8px">
      <button type="button" aria-pressed="true" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--btext); font-size: 14px; font-weight: 600">Communities</button>
      <button type="button" aria-pressed="false" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: transparent; font-size: 14px; font-weight: 500">Events</button>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; font-weight: 600; color: var(--mf)">{{g.title}}</span><span style="font-size: 12px; color: var(--mf)">{{g.count}}</span></div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{g.chips}}" as="c" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{c.on}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 500">{{c.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <a href="Explore.dc.html" style="height: 52px; border-radius: 6px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Show 12 communities</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => ({ label, on: !!on, border: on ? 'var(--line)' : 'var(--border)', bg: on ? 'var(--tint)' : 'transparent', fg: on ? 'var(--btext)' : 'var(--fg)' });
    return {
      groups: [
        { title: 'Location', count: 'Atlanta', chips: [chip('Near me', true), chip('Atlanta', true), chip('Anywhere')] },
        { title: 'Community type', count: '2 picked', chips: [chip('Nightlife', true), chip('Food & wine', true), chip('Music'), chip('Networking'), chip('Art'), chip('Wellness')] },
        { title: 'Music genres', count: '1 picked', chips: [chip('House', true), chip('Afrobeats'), chip('R&B'), chip('Techno'), chip('Amapiano')] },
        { title: 'Event vibes', count: 'Any', chips: [chip('Upscale'), chip('Underground'), chip('Day party'), chip('Intimate')] }
      ]
    };
  }
}
</script>
</body>
</html>
