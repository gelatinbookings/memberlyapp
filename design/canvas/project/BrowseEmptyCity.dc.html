<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 60px 20px 0">

  <div style="display: flex; align-items: center; gap: 12px">

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 16px; padding: 0 8px">

    </div>
    <button type="button" style="height: 52px; width: 100%; border-radius: 6px; border: 0; background: var(--brand); color: #fff; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>Notify me</button>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{cities}}" as="c" hint-placeholder-count="6">
        <span style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; font-size: 13px">{{c}}</span>
