<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button,.mem input{font:inherit;color:inherit}
.mem input::placeholder{color:#a1a1a1}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 60px 20px 0">

  <div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Explore</h1>
    <div style="font-size: 13px; color: var(--mf); margin-top: 4px">Communities and events picked for you</div>
  </div>

  <label style="height: 48px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg><input type="search" placeholder="Community, event or vibe" aria-label="Search" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px"><a href="ExploreFilters.dc.html" aria-label="Filters" style="width: 36px; height: 36px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></a></label>

  <div style="display: flex; gap: 8px; margin: 0 -20px; padding: 0 20px; overflow: hidden">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button type="button" style="height: 44px; flex-shrink: 0; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 500; white-space: nowrap">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Top communities this week</span><a href="#all" style="font-size: 13px; font-weight: 500">See all</a></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{communities}}" as="c" hint-placeholder-count="2">
        <a href="EventPage.dc.html" style="display: flex; flex-direction: column; gap: 8px; color: var(--fg)">
          <img src="{{c.img}}" alt="" style="width: 100%; height: 150px; object-fit: cover; border-radius: 16px; display: block">
          <span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
          <span style="display: block; font-size: 13px; color: var(--mf); margin-top: -6px">{{c.meta}}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Near you this week</div>
    <sc-for list="{{events}}" as="e" hint-placeholder-count="2">
      <a href="EventPage.dc.html" style="display: flex; align-items: center; gap: 12px; color: var(--fg)">
        <img src="{{e.img}}" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
        <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">{{e.name}}</span><span style="display: block; font-size: 13px; color: var(--mf)">{{e.meta}}</span></span>
        <span style="font-size: 13px; font-weight: 600; color: var(--btext); flex-shrink: 0">{{e.price}}</span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; box-sizing: border-box; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; padding: 6px; gap: 4px">
    <a href="HomeMap.dc.html" aria-label="Home" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="Explore.dc.html" aria-current="page" style="flex: 1.6 1 0; height: 50px; border-radius: 999px; background: var(--tint); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--btext); font-size: 13px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9"></polygon></svg>Explore</a>
    <a href="Events.dc.html" aria-label="Events" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
    <a href="Me.dc.html" aria-label="Me" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => ({ label, border: on ? 'var(--line)' : 'var(--border)', bg: on ? 'var(--tint)' : 'transparent', fg: on ? 'var(--btext)' : 'var(--fg)' });
    return {
      chips: [chip('All', true), chip('Nightlife'), chip('Dinners'), chip('Day parties'), chip('Concerts'), chip('Workshops')],
      communities: [
        { img: '/_blob/3a9257843bd2c59903b82feae14987ad', name: 'Second Sundays', meta: 'Atlanta · 1.2k members' },
        { img: '/_blob/b39a861e06336e704d715f19909f7729', name: 'Supper Club ATL', meta: 'Atlanta · 640 members' }
      ],
      events: [
        { img: '/_blob/f5fe394418c7a84914baa544150400c5', name: 'Rooftop Hours', meta: 'Rooftop Society · Fri 9:00 PM', price: 'From $30' },
        { img: '/_blob/5c350a2c20f547df70fc343bc26ffaaa', name: 'Daylight', meta: 'Day Party Collective · Sat 2:00 PM', price: 'From $25' }
      ]
    };
  }
}
</script>
</body>
</html>
