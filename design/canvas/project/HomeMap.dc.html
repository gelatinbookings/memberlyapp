<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, map first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;--ok-bg:rgba(6,78,59,.4);--ok-fg:#6ee7b7;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 560px; background: #111; overflow: hidden" aria-label="Map of Atlanta, placeholder" role="img">
    <div style="position: absolute; left: -40px; top: 150px; width: 480px; height: 2px; background: #222; transform: rotate(-12deg)"></div>
    <div style="position: absolute; left: -40px; top: 300px; width: 480px; height: 2px; background: #222; transform: rotate(8deg)"></div>
    <div style="position: absolute; left: 120px; top: -40px; width: 2px; height: 640px; background: #222; transform: rotate(14deg)"></div>
    <div style="position: absolute; left: 260px; top: -40px; width: 2px; height: 640px; background: #222; transform: rotate(-6deg)"></div>
    <div style="position: absolute; left: 40px; top: 420px; width: 360px; height: 2px; background: #222; transform: rotate(-20deg)"></div>
    <div style="position: absolute; left: 180px; top: 230px; width: 70px; height: 50px; border-radius: 10px; background: #161616"></div>
    <div style="position: absolute; left: 60px; top: 330px; width: 90px; height: 60px; border-radius: 10px; background: #161616"></div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
      <span style="position: absolute; left: {{p.x}}; top: {{p.y}}; height: 34px; padding: 0 10px 0 6px; border-radius: 999px; background: var(--brand); color: #fff; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap"><span style="width: 22px; height: 22px; border-radius: 999px; background: #fff; color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 11px">{{p.n}}</span>{{p.label}}</span>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 60px; display: flex; gap: 8px">
    <button type="button" style="height: 48px; flex-grow: 1; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 600; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>Atlanta<span style="flex-grow: 1"></span><span style="font-size: 13px; font-weight: 500; color: var(--mf)">Tonight</span></button>
    <button type="button" aria-label="Search" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg></button>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 500px; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <span style="width: 40px; height: 4px; border-radius: 999px; background: var(--border); align-self: center"></span>
    <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">4 events tonight</span><a href="Explore.dc.html" style="font-size: 13px; font-weight: 500">List view</a></div>
    <a href="EventPage.dc.html" style="display: flex; align-items: center; gap: 12px; color: var(--fg)">
      <img src="/_blob/3a9257843bd2c59903b82feae14987ad" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
      <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Warehouse Friday</span><span style="display: block; font-size: 13px; color: var(--mf); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Second Sundays · 10 PM · 1.2 mi</span></span>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 5px 9px; background: var(--ok-bg); color: var(--ok-fg); flex-shrink: 0">Pass</span>
    </a>
    <a href="EventPage.dc.html" style="display: flex; align-items: center; gap: 12px; color: var(--fg)">
      <img src="/_blob/f5fe394418c7a84914baa544150400c5" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; display: block">
      <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">Rooftop Hours</span><span style="display: block; font-size: 13px; color: var(--mf); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rooftop Society · 9 PM · 2.4 mi</span></span>
      <span style="font-size: 13px; font-weight: 600; color: var(--btext); flex-shrink: 0">From $30</span>
    </a>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 34px; height: 64px; box-sizing: border-box; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; padding: 6px; gap: 4px">
    <a href="HomeMap.dc.html" aria-current="page" style="flex: 1.6 1 0; height: 50px; border-radius: 999px; background: var(--tint); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--btext); font-size: 13px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Explore.dc.html" aria-label="Explore" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9"></polygon></svg></a>
    <a href="Events.dc.html" aria-label="Events" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
    <a href="Me.dc.html" aria-label="Me" style="flex: 1 1 0; height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--mf)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pins: [
        { x: '150px', y: '190px', n: '1', label: 'Warehouse Friday' },
        { x: '230px', y: '290px', n: '2', label: 'Rooftop Hours' },
        { x: '70px', y: '380px', n: '3', label: 'Night Service' },
        { x: '250px', y: '420px', n: '4', label: 'Long Table' }
      ]
    };
  }
}
</script>
</body>
</html>
