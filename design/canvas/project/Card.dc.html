<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Memberly Card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;--ok-bg:rgba(6,78,59,.4);--ok-fg:#6ee7b7;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 60px 20px 0">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="HomeMap.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg); flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; flex-grow: 1; text-align: center">My Memberly Card</h1>
    <span style="width: 44px; flex-shrink: 0"></span>
  </div>

  <div style="border: 1px solid var(--line); border-radius: 16px; background: var(--tint); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="width: 100%; display: flex; align-items: center; justify-content: space-between">
      <span style="width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">M</span>
      <span style="font-size: 12px; font-weight: 600; color: var(--btext)">Scan at the door</span>
    </div>
    <div style="width: 196px; height: 196px; border-radius: 12px; background: #fff; padding: 12px; box-sizing: border-box; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 2px" role="img" aria-label="Member QR code">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="121">
        <span style="display: block; width: 100%; aspect-ratio: 1; background: {{c}}"></span>
      </sc-for>
    </div>
    <div style="text-align: center">
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">Jordan Reese</div>
      <div style="font-size: 13px; color: var(--btext)">Member · 3 communities</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Your memberships</div>
    <div style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); overflow: hidden">
      <sc-for list="{{memberships}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid {{m.top}}">
          <img src="{{m.img}}" alt="" style="width: 40px; height: 40px; object-fit: cover; border-radius: 10px; flex-shrink: 0; display: block">
          <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{m.name}}</span><span style="display: block; font-size: 12px; color: var(--mf)">{{m.tier}}</span></span>
          <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 8px; background: var(--ok-bg); color: var(--ok-fg)">Active</span>
        </div>
      </sc-for>
    </div>
  </div>

  <button type="button" style="height: 48px; border-radius: 6px; border: 1px solid var(--border); background: transparent; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Add to Wallet</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      '11111110101111111', '10000010001000001', '10111010101011101', '10111011001011101', '10111010101011101', '10000010101000001', '11111110101111111',
      '00000000100000000', '10110101011011010', '01001010100100101', '11111110010111010'
    ];
    const cells = [];
    for (let r = 0; r < 11; r++) for (let c = 0; c < 11; c++) cells.push(rows[r][c] === '1' ? '#000' : '#fff');
    return {
      cells,
      memberships: [
        { img: '/_blob/3a9257843bd2c59903b82feae14987ad', name: 'Second Sundays', tier: 'Inner Circle · renews Dec 1', top: 'transparent' },
        { img: '/_blob/b39a861e06336e704d715f19909f7729', name: 'Supper Club ATL', tier: 'Table member', top: 'var(--border)' },
        { img: '/_blob/f5fe394418c7a84914baa544150400c5', name: 'Rooftop Society', tier: 'Free tier', top: 'var(--border)' }
      ]
    };
  }
}
</script>
</body>
</html>
