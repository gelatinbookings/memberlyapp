<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Date change before the DJ accepts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px; opacity: .35">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Date &amp; time</div>
    <div style="height: 300px; border: 1px solid var(--border); border-radius: 16px; background: var(--card)"></div>
    <div style="height: 48px; border: 1px solid var(--border); border-radius: 6px; background: var(--card)"></div>
  </div>

  <div role="alertdialog" aria-label="Change the date?" style="position: absolute; left: 20px; right: 20px; top: 240px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">Change the date to Sat, Nov 21?</div>
    <p style="margin: 0; font-size: 14px; color: var(--mf)">The date is part of the offer. Changing it cancels the request to KOYO, releases the hold on your card, and you offer again for the new night. They may not be free.</p>
    <p style="margin: 0; font-size: 14px; color: var(--mf)">We'll tell your 212 pass holders about the new date.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
      <a href="DateTime.dc.html" style="height: 48px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: var(--fg)">Keep Fri, Nov 20</a>
      <a href="LineupEmpty.dc.html" style="height: 48px; border-radius: 6px; background: #ef4444; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">Change date</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
