<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse talent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 60px 0 0">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 20px">
    <div style="flex-grow: 1; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">Browse talent</h1><div style="font-size: 13px; color: var(--mf)">5 DJs open on Fri, Nov 20 in Atlanta</div></div>
    <a href="LineupEmpty.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg); flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px; overflow: hidden">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <a href="BrowseFilters.dc.html" style="height: 44px; flex-shrink: 0; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap">{{f.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{djs}}" as="dj" hint-placeholder-count="4">
      <div style="border: 1px solid {{dj.border}}; background: {{dj.bg}}; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
        <a href="DjProfile.dc.html" style="display: flex; align-items: flex-start; gap: 12px; color: var(--fg)">
          <sc-if value="{{dj.hasPhoto}}" hint-placeholder-val="{{true}}"><img src="{{dj.img}}" alt="" style="width: 52px; height: 52px; object-fit: cover; border-radius: 999px; flex-shrink: 0; display: block"></sc-if>
          <sc-if value="{{dj.noPhoto}}" hint-placeholder-val="{{false}}"><span style="width: 52px; height: 52px; border-radius: 999px; background: var(--tint); color: var(--btext); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0">{{dj.initials}}</span></sc-if>
          <span style="min-width: 0; flex-grow: 1">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 600">{{dj.name}}</span><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: var(--muted); color: var(--mf); border-radius: 999px; padding: 3px 7px">{{dj.tier}}</span></span>
            <span style="display: block; font-size: 13px; color: var(--mf)">{{dj.genres}}</span>
            <span style="display: block; font-size: 13px; color: {{dj.drawFg}}; margin-top: 2px">{{dj.draw}}</span>
          </span>
        </a>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: {{dj.rateSize}}; font-weight: {{dj.rateWeight}}; color: {{dj.rateFg}}; font-variant-numeric: tabular-nums">{{dj.rate}}</span>
          <button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{dj.btnBorder}}; background: {{dj.btnBg}}; color: {{dj.btnFg}}; font-weight: 600; font-size: 14px">{{dj.btn}}</button>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 34px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: var(--bg)">
    <a href="LineupOffers.dc.html" style="height: 52px; border-radius: 6px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Done · 1 added</a>
    <div style="font-size: 12px; color: var(--mf); text-align: center">DJs, availability and rates from Gelatin</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => ({ label, border: on ? 'var(--line)' : 'var(--border)', bg: on ? 'var(--tint)' : 'transparent', fg: on ? 'var(--btext)' : 'var(--fg)' });
    const d = (o) => {
      const priv = o.rate === 'Private rate';
      const hasDraw = !o.draw.startsWith('Draw not');
      return Object.assign({
        hasPhoto: !!o.img, noPhoto: !o.img,
        drawFg: hasDraw ? 'var(--btext)' : 'var(--mf)',
        rateSize: priv ? '13px' : '17px', rateWeight: priv ? '500' : '700', rateFg: priv ? 'var(--mf)' : 'var(--fg)',
        border: o.added ? 'var(--line)' : 'var(--border)', bg: o.added ? 'var(--tint)' : 'var(--card)',
        btn: o.added ? 'Added' : 'Add', btnBorder: o.added ? 'var(--line)' : 'var(--border)', btnBg: o.added ? 'var(--brand)' : 'transparent', btnFg: o.added ? '#fff' : 'var(--fg)'
      }, o);
    };
    return {
      filters: [chip('Atlanta'), chip('Fri, Nov 20'), chip('Any budget'), chip('Any genre')],
      djs: [
        d({ img: '/_blob/b01b0c9e4f75b042e783748d8e3c206c', name: 'KOYO', tier: 'Top performer', genres: 'House · Afrobeats', draw: 'Draws 180–260 · avg 215', rate: '$450', added: true }),
        d({ img: '/_blob/e4f2447886999b9fd6549c5500f55021', name: 'NIGHTFORM', tier: 'City pillar', genres: 'Techno · Bass', draw: 'Draws 240–330 · avg 281', rate: 'Private rate' }),
        d({ initials: 'BM', name: 'BLKMTN', tier: 'Resident', genres: 'Baile funk · Jersey club', draw: 'Draws 150–205 · avg 172', rate: '$390' }),
        d({ initials: 'SH', name: 'Sable Hart', tier: 'Verified', genres: 'Soul · Disco', draw: 'Draw not yet established', rate: '$275' })
      ]
    };
  }
}
</script>
</body>
</html>
