<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Date, time and place</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.mem{--bg:#000;--fg:#fafafa;--card:#0d0d0d;--muted:#1f1f1f;--mf:#a1a1a1;--border:#292929;--brand:#9333ea;--tint:rgba(59,7,100,.4);--btext:#d8b4fe;--line:#6b21a8;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);font-size:15px;line-height:1.45}
.mem a{color:var(--btext);text-decoration:none}
.mem button,.mem input{font:inherit;color:inherit}
.mem ::selection{background:#6b21a8;color:#fff}
</style>
</helmet>
<div class="mem" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 60px 20px 0">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="CreateEvent.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg); flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
    <div style="flex-grow: 1; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">Date &amp; time</h1><div style="font-size: 13px; color: var(--mf)">Warehouse Friday</div></div>
  </div>

  <div style="border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">November 2026</span><span style="display: flex; gap: 4px"><button type="button" aria-label="Previous month" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border); background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><button type="button" aria-label="Next month" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border); background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; font-size: 11px; color: var(--mf); text-align: center; font-weight: 600"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <button type="button" style="height: 40px; border-radius: 999px; border: 0; background: {{d.bg}}; color: {{d.fg}}; font-size: 14px; font-weight: {{d.weight}}">{{d.n}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Starts</span><input value="10:00 PM" style="height: 48px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; font-size: 16px; font-weight: 600"></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Ends</span><input value="2:00 AM" style="height: 48px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; font-size: 16px; font-weight: 600"></label>
  </div>
  <div style="font-size: 12px; color: var(--mf); margin-top: -8px">Eastern Time, from the venue. Ends the next morning.</div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Location</div>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">Venue</span><input value="Westside warehouse" style="height: 48px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; font-size: 15px"></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 500">City</span><span style="height: 48px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">Atlanta, GA<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></label>
    <div style="font-size: 12px; color: var(--mf)">The city and date decide which DJs you can book in Lineup.</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="CreateEvent.dc.html" style="height: 52px; border-radius: 6px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [];
    for (let i = 0; i < 35; i++) {
      const n = i; // Nov 2026 starts on a Sunday
      const inMonth = n >= 0 && n < 30;
      const sel = n === 19;
      days.push({ n: inMonth ? String(n + 1) : '', bg: sel ? 'var(--brand)' : 'transparent', fg: sel ? '#fff' : (inMonth ? 'var(--fg)' : 'transparent'), weight: sel ? '700' : '500' });
    }
    return { days };
  }
}
</script>
</body>
</html>
